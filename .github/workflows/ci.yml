name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ui:
    name: ui (tsc · node tests · schema · boundary · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: typecheck (tsc -b --noEmit)
        run: npm run typecheck
      - name: node unit tests
        run: npm test
      - name: schema drift guard
        run: npm run check:plot-schema
      - name: boundary lint (no lib→app imports)
        run: npm run check:plot-boundary
      - name: build self-contained bundles
        run: npm run build:plot-inline
      - name: package-data sync guard
        run: npm run check:plot-assets

  python:
    name: python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: create venv + editable install
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: pytest
        run: uv run pytest tests/ -q

  wheel:
    name: wheel + bare-venv quickstart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: build wheel
        run: uv build
      - name: bare-venv install + quickstart render
        run: |
          uv venv /tmp/bare
          uv pip install --python /tmp/bare/bin/python dist/*.whl pillow
          cat > /tmp/quickstart.py <<'PY'
          import numpy as np
          import cairn_plot as cp
          rep = (
              cp.report("QS")
              .md("# hi")
              .add(cp.Line(np.arange(50).cumsum()))
              .add(cp.Image(np.random.rand(48, 48)))
          )
          out = rep.save("/tmp/qs.html")
          size = __import__("os").path.getsize(out)
          assert size > 10_000, size
          print("rendered", size, "bytes offline")
          PY
          /tmp/bare/bin/python /tmp/quickstart.py

  smoke:
    name: smoke:plot (headless gallery)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: python venv (for the demo the smoke drives)
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: build bundles + sync package data
        working-directory: ui
        run: |
          npm ci
          npm run build:plot-inline
          npm run sync:plot-assets
      - name: smoke render (24/24 sections)
        working-directory: ui
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run smoke:plot
      - name: smoke render (JS builder surface — examples/demo_js_api.html)
        working-directory: ui
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run smoke:js

  harness:
    name: test:harness (WebGPU WGSL↔TS parity proofs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: install ui deps
        working-directory: ui
        run: npm ci
      # Proves the RUNNER itself fails/exits-nonzero on a FAIL harness. Hermetic
      # (synthetic PASS+FAIL pages, WebGPU probe bypassed) — no GPU needed.
      - name: runner self-test
        working-directory: ui
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:harness:selftest
      # Drives the engine WGSL↔TS parity harnesses headlessly. The runner tries
      # a hardware WebGPU adapter, then the SwiftShader/Dawn software adapter; if
      # NEITHER is available it SKIPS LOUDLY (annotated ::warning:: naming the
      # unrun proofs) and exits 0 — it never silently passes. A real FAIL in any
      # harness exits nonzero and fails this job.
      - name: run parity harnesses
        working-directory: ui
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          # SwiftShader renders 3-10x slower than local hardware; the stress and
          # realstack harnesses legitimately run 40s+ there. 3x headroom so a
          # slower runner can't turn a passing harness into a TIMEOUT.
          HARNESS_TIMEOUT_MS: "180000"
        run: npm run test:harness
