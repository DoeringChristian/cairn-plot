<!doctype html>
<html lang="en" data-cairn-harness="self-driving">
  <head>
    <meta charset="utf-8" />
    <title>compare settings sync harness</title>
    <style>
      body { font-family: ui-monospace, monospace; font-size: 13px; padding: 16px; background: #111; color: #eee; }
      #status { font-size: 28px; font-weight: bold; margin-bottom: 12px; }
      #result div { white-space: pre-wrap; }
      #mounts { display: flex; gap: 8px; }
      #mount-a, #mount-b, #mount-c { width: 360px; height: 260px; background: #222; }
      #mount-d { width: 480px; height: 300px; background: #222; }
    </style>
  </head>
  <body>
    <h1>media-compare/GpuComparePane — COMPARE↔COMPARE settings sync</h1>
    <div id="status">RUNNING&hellip;</div>
    <div id="mounts">
      <div id="mount-a"></div>
      <div id="mount-b"></div>
      <!-- A third pane wrapped in InFullscreenOverlayContext — the OVERLAY (modal)
           split-flip path, where arrows act with no hover/focus. -->
      <div id="mount-c"></div>
    </div>
    <!-- A STACKED cp.Grid of two compare panes — settings (incl. diff mode)
         auto-sync across the stack with NO selection. -->
    <div id="mount-d"></div>
    <div id="result"></div>
    <!-- Self-driving (see the <html data-cairn-harness>): dispatches its own
         selection gestures and drives the panes' exposed control wrappers, then
         sets #status to PASS/FAIL — so `npm run test:harness` runs it in the
         DEFAULT set (it needs WebGPU for the engine compare pane; the runner
         skips-loud when no adapter is available). -->
    <script type="module" src="./compare-settings-sync.browser.bundle.js"></script>
  </body>
</html>
