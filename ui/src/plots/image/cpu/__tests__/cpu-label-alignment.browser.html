<!doctype html>
<html lang="en" data-cairn-harness="self-driving" data-cairn-harness-dpr="2">
  <head>
    <meta charset="utf-8" />
    <title>CPU label/paint alignment harness (DPR 2)</title>
    <!-- Committed compiled Tailwind CSS (the same file the sibling image
         harnesses link): the pane lays itself out with w-full/h-full/flex/
         absolute-inset-0 utilities, so WITHOUT this stylesheet the viewport
         element has no size and every pixel measurement below is meaningless. -->
    <link rel="stylesheet" href="./harness-style.css" />
    <!-- `data-cairn-harness-dpr="2"` — the runner launches a SEPARATE Chromium
         with `--force-device-scale-factor=2` and runs this page there, so
         `window.devicePixelRatio` is 2 AND the device-pixel content box really
         is 2x the CSS box. The presentation canvas' backing store is device px
         while the quad is CSS px, so a dropped or doubled dpr factor is what
         this ratio is meant to expose.

         The scale factor must be a LAUNCH FLAG. A headless Chromium does NOT
         apply a CDP `Emulation.setDeviceMetricsOverride` deviceScaleFactor to
         its device-pixel content box: under the override a 100.5x50.25 CSS px
         element still reported devicePixelContentBoxSize 101x50 at
         devicePixelRatio 2, i.e. a 1x backing store wearing a DPR-2 label —
         this page then silently duplicated its own DPR-1 sibling. The harness
         MEASURES canvas.width / box.width and FAILS the run when it differs
         from `window.devicePixelRatio` by more than 0.01, so a run can never
         claim a ratio it did not have.

         The DPR-1 pass is the sibling page
         `cpu-label-alignment-dpr1.browser.html`, which loads THIS SAME bundle
         without the attribute. -->
    <style>
      body { font-family: ui-monospace, monospace; font-size: 13px; padding: 16px; background: #111; color: #eee; }
      #status { font-size: 28px; font-weight: bold; margin-bottom: 12px; }
      #result div { white-space: pre-wrap; }
      /* The host is resized per case by the harness; keep it out of the flow's way. */
      #host { margin: 8px 0; }
    </style>
  </head>
  <body>
    <h1>CPU/GPU image pane — TEV labels land on the texels the pane paints</h1>
    <div id="status">RUNNING&hellip;</div>
    <div id="result"></div>
    <div id="host"></div>
    <script type="module" src="./cpu-label-alignment.browser.bundle.js"></script>
  </body>
</html>
