<!doctype html>
<html lang="en" data-cairn-harness="self-driving" data-cairn-harness-dpr="2">
  <head>
    <meta charset="utf-8" />
    <title>CPU label/paint alignment harness (DPR 2)</title>
    <!-- Committed compiled Tailwind CSS (the same file the sibling image
         harnesses link): the pane lays itself out with w-full/h-full/flex/
         absolute-inset-0 utilities, so WITHOUT this stylesheet the viewport
         element has no size and every pixel measurement below is meaningless. -->
    <link rel="stylesheet" href="./harness-style.css" />
    <!-- `data-cairn-harness-dpr="2"` — the runner drives this page under an
         `Emulation.setDeviceMetricsOverride` at deviceScaleFactor 2, so
         `window.devicePixelRatio` is 2. The presentation canvas' backing store
         is device px while the quad is CSS px, so a dropped or doubled dpr
         factor is what this ratio is meant to expose.

         CAVEAT — do not read this page as "a 2x backing store was tested". A
         HEADLESS Chromium does NOT apply the CDP deviceScaleFactor to its
         device-pixel content box: measured here, a 100.5x50.25 CSS px element
         still reports devicePixelContentBoxSize 101x50 at devicePixelRatio 2.
         Under a headless runner this page therefore exercises the
         devicePixelRatio-vs-measured-box MISMATCH case (the pane must believe
         the measured box, not the ratio); on a real 2x display, or a Chromium
         launched with --force-device-scale-factor=2, the same page is a genuine
         2x backing store. The harness MEASURES canvas.width / box.width and
         prints one explicit line per run naming which of the two it got, so a
         run can never claim a ratio it did not have.

         The DPR-1 pass is the sibling page
         `cpu-label-alignment-dpr1.browser.html`, which loads THIS SAME bundle
         without the attribute. -->
    <style>
      body { font-family: ui-monospace, monospace; font-size: 13px; padding: 16px; background: #111; color: #eee; }
      #status { font-size: 28px; font-weight: bold; margin-bottom: 12px; }
      #result div { white-space: pre-wrap; }
      /* The host is resized per case by the harness; keep it out of the flow's way. */
      #host { margin: 8px 0; }
    </style>
  </head>
  <body>
    <h1>CPU/GPU image pane — TEV labels land on the texels the pane paints</h1>
    <div id="status">RUNNING&hellip;</div>
    <div id="result"></div>
    <div id="host"></div>
    <script type="module" src="./cpu-label-alignment.browser.bundle.js"></script>
  </body>
</html>
